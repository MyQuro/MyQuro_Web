<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#000000"/>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Poppins:wght@900&amp;display=swap');
      .my-text {
        font-family: 'Alex Brush', cursive;
        fill: #d5b263;
        font-size: 150px;
      }
      .quro-text {
        font-family: 'Poppins', 'Segoe UI', sans-serif;
        font-weight: 900;
        fill: #ffffff;
        font-size: 100px;
      }
      .dot {
        fill: #d5b263;
      }
    </style>
  </defs>
  <g transform="translate(20, 290)">
    <text x="0" y="0" class="my-text">My</text>
    <text x="240" y="-12" class="quro-text">Quro<tspan class="dot">.</tspan></text>
  </g>
</svg>
